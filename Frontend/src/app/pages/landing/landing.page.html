<section class="landing">
  <img class="hero" src="/landing.jpg" alt="Airbus A400M">

  <div class="stage">
    <header class="toolbar">
      <div class="title">
        <h1>Events Fleet</h1>
      </div>
      @if (!loading() && !error()) {
        <label class="search">
          <span class="visually-hidden">Search aircraft</span>
          <input
            type="search"
            [ngModel]="query()"
            (ngModelChange)="query.set($event)"
            placeholder="Search aircraft…"
          >
        </label>
        <app-ui-button (click)="openAdd()">New aircraft</app-ui-button>
      }
    </header>

    @if (error()) {
      <p class="banner">{{ error() }}</p>
    } @else if (loading()) {
      <p class="muted">Loading fleet…</p>
    } @else {
      <app-ui-table
        variant="card"
        [columns]="fleetCols()"
        [rows]="fleet()"
        [search]="query()"
        [framed]="false"
        [rowClickable]="true"
        initialSort="aircraft"
        empty="No aircraft match these filters."
        [trackBy]="trackAircraft"
        (rowClick)="select($event)"
      >
        <ng-template uiTableCell="aircraft" let-ac>
          <span class="msn">MSN {{ padMsn(ac.msn) }}</span>
        </ng-template>
        <ng-template uiTableCell="airforce" let-ac>
          <span class="nation">
            <app-flag-icon [nation]="ac.nation" />
            {{ ac.nation }}
          </span>
        </ng-template>
      </app-ui-table>
    }
  </div>
</section>

<app-ui-modal [open]="adding()" title="New aircraft" (closed)="cancelAdd()">
  <form class="create" (ngSubmit)="submit()">
    <label class="field">
      <span>MSN</span>
      <input
        type="number"
        name="msn"
        min="1"
        max="999"
        [(ngModel)]="msnInput"
        placeholder="014"
        autofocus
      >
    </label>

    <label class="field">
      <span>Air force</span>
      <app-ui-segmented [options]="nationOptions()" [(value)]="nationInput" />
    </label>

    <label class="field">
      <span>Aircraft chief</span>
      <select name="chief" [(ngModel)]="chiefInput">
        @for (chief of catalog().chiefs; track chief) {
          <option [value]="chief">{{ chief }}</option>
        }
      </select>
    </label>

    <label class="field">
      <span>Type of maintenance</span>
      <app-ui-segmented [options]="eventOptions()" [(value)]="eventInput" />
    </label>

    <label class="field">
      <span>Retrofit event</span>
      <app-ui-segmented [options]="loadOptions()" [(value)]="loadInput" />
    </label>

    <div class="dates">
      <label class="field">
        <span>Hang Over (HO)</span>
        <input type="date" name="ho" [(ngModel)]="hoInput">
      </label>
      <label class="field">
        <span>Transfer of Custody (ToC)</span>
        <input type="date" name="toc" [(ngModel)]="tocInput">
      </label>
    </div>

    @if (formError()) {
      <p class="banner">{{ formError() }}</p>
    }

    <div class="actions">
      <app-ui-button variant="ghost" type="button" (click)="cancelAdd()">Cancel</app-ui-button>
      <app-ui-button type="submit" [disabled]="saving()">Add</app-ui-button>
    </div>
  </form>
</app-ui-modal>
