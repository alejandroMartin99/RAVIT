<div class="host" aria-live="polite" aria-relevant="additions">
  @for (toast of toasts(); track toast.id) {
    <aside
      class="toast"
      [class.is-ok]="toast.kind === 'ok'"
      [class.is-fail]="toast.kind === 'fail'"
      [class.is-in]="toast.entered"
      [class.is-out]="toast.leaving"
    >
      <span class="icon" aria-hidden="true">
        @if (toast.kind === 'ok') {
          <svg viewBox="0 0 24 24">
            <path fill="currentColor" d="M9.55 17.17 4.8 12.42l1.4-1.4 3.35 3.34 8.25-8.25 1.4 1.41z"/>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24">
            <path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/>
          </svg>
        }
      </span>
      <p>{{ toast.message }}</p>
    </aside>
  }
</div>
